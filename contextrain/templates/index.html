<title>ContexTrain</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #0f1117;
        color: #f5f5f5;
    }

    .container {
        width: min(900px, 92%);
        margin: 0 auto;
        padding: 70px 0;
    }

    .header {
        text-align: center;
        margin-bottom: 45px;
    }

    .header h1 {
        margin: 0 0 12px;
        font-size: 42px;
    }

    .header p {
        margin: 0;
        color: #9ca3af;
        font-size: 17px;
    }

    .card {
        background: #181b23;
        border: 1px solid #2a2f3a;
        border-radius: 14px;
        padding: 24px;
    }

    textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        padding: 16px;
        border: 1px solid #343a46;
        border-radius: 10px;
        background: #10131a;
        color: #f5f5f5;
        font-family: inherit;
        font-size: 15px;
        outline: none;
    }

    textarea:focus {
        border-color: #6b7280;
    }

    textarea::placeholder {
        color: #6b7280;
    }

    .form-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
    }

    .hint {
        color: #6b7280;
        font-size: 13px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 20px;
        background: #f5f5f5;
        color: #111318;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #dcdcdc;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    .examples {
        margin-top: 24px;
    }

    .examples h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #9ca3af;
    }

    .example-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .example-button {
        background: #20242d;
        color: #d1d5db;
        border: 1px solid #303642;
        font-weight: normal;
        padding: 9px 12px;
    }

    .example-button:hover {
        background: #292e39;
    }

    .answer {
        margin-top: 24px;
    }

    .answer h2 {
        margin: 0 0 12px;
        font-size: 18px;
    }

    .answer-content {
        background: #10131a;
        border: 1px solid #2a2f3a;
        border-radius: 10px;
        padding: 20px;
        line-height: 1.7;
        color: #d1d5db;
        white-space: pre-wrap;
    }

    .footer {
        text-align: center;
        margin-top: 35px;
        color: #6b7280;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .container {
            padding: 40px 0;
        }

        .header h1 {
            font-size: 34px;
        }

        .form-footer {
            align-items: flex-start;
            gap: 12px;
            flex-direction: column;
        }

        button[type="submit"] {
            width: 100%;
        }
    }
</style>

</head>

<body>

```
<main class="container">

    <header class="header">
        <h1>ContexTrain</h1>
        <p>Ask questions about your codebase using AI-powered semantic search.</p>
    </header>

    <section class="card">

        <form method="post" action="/ask" id="question-form">

            <textarea
                name="question"
                id="question"
                placeholder="Ask a question about your project..."
                required
            ></textarea>

            <div class="form-footer">
                <span class="hint">Ask about files, functions, architecture or implementation.</span>

                <button type="submit" id="ask-button">
                    Ask ContexTrain
                </button>
            </div>

        </form>

        <div class="examples">
            <h3>Try an example</h3>

            <div class="example-buttons">
                <button
                    type="button"
                    class="example-button"
                    onclick="setQuestion('How does ContexTrain find relevant code for a question?')"
                >
                    How does semantic search work?
                </button>

                <button
                    type="button"
                    class="example-button"
                    onclick="setQuestion('Where is the LLM configured?')"
                >
                    Where is the LLM configured?
                </button>

                <button
                    type="button"
                    class="example-button"
                    onclick="setQuestion('What files are responsible for processing a question?')"
                >
                    How is a question processed?
                </button>
            </div>
        </div>

        {% if answer %}
            <section class="answer">
                <h2>Answer</h2>

                <div class="answer-content">{{ answer }}</div>
            </section>
        {% endif %}

    </section>

    <footer class="footer">
        ContexTrain · AI-powered codebase context
    </footer>

</main>

<script>
    function setQuestion(question) {
        document.getElementById("question").value = question;
        document.getElementById("question").focus();
    }

    document.getElementById("question-form").addEventListener("submit", function () {
        const button = document.getElementById("ask-button");

        button.disabled = true;
        button.textContent = "Thinking...";
    });
</script>
```
